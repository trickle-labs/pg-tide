schema_version = 1

[[connector]]
id = "postgresql-outbox"
name = "PostgreSQL native outbox"
kind = "connector"
maturity = "supported"
owner = "@grove"
security_contact = "@grove"
source_types = ["outbox"]
sink_types = []
default_build = true
tested_versions = ["PostgreSQL 18"]
docs = ["docs/src/sources/outbox.md"]
contract_tests = ["pg-tide-relay/tests/outbox_source_test.rs"]
