duplicate_tests = ["pg-tide-relay/tests/public_api_outbox_to_nats_e2e.rs"]
auth_tests = ["pg-tide-relay/tests/publisher_acl_test.rs"]
tls_tests = ["pg-tide-relay/tests/tls_test.rs"]
redaction_tests = ["pg-tide-relay/src/config.rs"]
metrics_evidence = ["pg-tide-relay/src/metrics.rs"]
runbooks = ["docs/src/operations/runbook-crash-recovery.md"]
upgrade_tests = ["pg-tide-relay/tests/v042_validation_test.rs"]

