ci_job = "network-security-core"
command = "just test-security"
targets = ["pg-tide-relay/src/pg_tls.rs", "pg-tide-relay/src/http_util.rs", "pg-tide-relay/tests"]
dependencies = ["docker", "postgresql-18", "nats"]
owner = "@grove"
blocking = true
max_retries = 0
allow_local_skip = false
flake_policy = "never-quarantine"
evidence = ["target/required-tests/{id}.json"]

