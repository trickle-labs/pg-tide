# pg-tide Prometheus Alerting Rules
# Generated by pg-tide v0.27.0
#
# Deploy via Prometheus Operator PrometheusRule or by adding this file
# to your Prometheus `rule_files:` configuration.
#
# All metric names correspond to constants in pg-tide-relay/src/metrics.rs.
# Threshold values can be overridden via Prometheus label matchers.

groups:
  - name: pg_tide_relay_pipeline
    interval: 60s
    rules:
      # PgTideRelayPipelinePaused
      # Fires when any pipeline remains in the paused/unhealthy state for more
      # than 5 minutes. A paused pipeline is not delivering messages; investigate
      # via `pg-tide status` and `pg-tide doctor`.
      - alert: PgTideRelayPipelinePaused
        expr: pg_tide_relay_pipeline_healthy == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pg-tide pipeline {{ $labels.pipeline }} is paused"
          description: >
            Pipeline {{ $labels.pipeline }} (tenant: {{ $labels.tenant }}) has
            been unhealthy for more than 5 minutes. Check `pg-tide status` and
            inspect the relay logs for the error that caused the pause.
            Metrics dashboard: pg-tide Relay Health → Pipeline Health row.

      # PgTideRelayHighConsumerLag
      # Fires when any pipeline has a consumer lag above 10 000 messages for
      # more than 2 minutes. This indicates the relay is falling behind the
      # outbox write rate; consider scaling relay replicas or investigating
      # sink latency.
      - alert: PgTideRelayHighConsumerLag
        expr: pg_tide_relay_consumer_lag > 10000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "pg-tide pipeline {{ $labels.pipeline }} has high consumer lag"
          description: >
            Pipeline {{ $labels.pipeline }} consumer lag is {{ $value }} messages
            (threshold: 10 000). The relay is not keeping up with the outbox
            write rate. Check sink throughput via the Sink Latency dashboard row
            and consider adding relay replicas via `max_owned_pipelines`.

  - name: pg_tide_relay_dlq
    interval: 60s
    rules:
      # PgTideRelayDLQDepthHigh
      # Fires when more than 100 DLQ entries have been written in the last hour.
      # A sustained high DLQ write rate indicates systematic upstream data quality
      # problems or a misconfigured sink. Investigate via `pg-tide replay`.
      - alert: PgTideRelayDLQDepthHigh
        expr: increase(pg_tide_relay_dlq_entries_written_total[1h]) > 100
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "pg-tide DLQ rate is high for pipeline {{ $labels.pipeline }}"
          description: >
            Pipeline {{ $labels.pipeline }} wrote {{ $value }} DLQ entries in the
            last hour (threshold: 100). Investigate message content and sink
            configuration via `pg-tide replay dlq-requeue` or
            `tide.dlq_requeue()`. See operations/runbook-dlq-replay.md.

      # PgTideRelayDLQWriteError
      # Fires when any DLQ write failure is detected. A DLQ write error causes
      # the pipeline to pause permanently; immediate investigation is required.
      - alert: PgTideRelayDLQWriteError
        expr: increase(pg_tide_relay_dlq_write_errors_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "pg-tide DLQ write error for pipeline {{ $labels.pipeline }}"
          description: >
            Pipeline {{ $labels.pipeline }} failed to write to the DLQ and has
            been paused. Check INSERT privileges on `tide.relay_dlq` for the
            relay role, and verify disk space. Run `pg-tide doctor` for full
            diagnostics.

  - name: pg_tide_relay_pool
    interval: 30s
    rules:
      # PgTideRelayConnectionPoolSaturated
      # Fires when the waiting connections exceed 10% of idle+busy+waiting for
      # more than 1 minute. This precedes connection exhaustion errors on managed
      # databases (RDS, Cloud SQL) with low connection limits.
      - alert: PgTideRelayConnectionPoolSaturated
        expr: >
          pg_tide_relay_pool_connections{state="waiting"}
          / on() group_left()
          (
            sum(pg_tide_relay_pool_connections{state="idle"})
            + sum(pg_tide_relay_pool_connections{state="busy"})
            + sum(pg_tide_relay_pool_connections{state="waiting"})
          ) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "pg-tide coordinator connection pool is saturated"
          description: >
            More than 10% of coordinator pool connections are waiting for a free
            slot. Pool acquire P95 latency is likely elevated. Consider increasing
            `max_connections` in the relay config or reducing `max_owned_pipelines`
            to lower connection demand. See Connection Pool dashboard row.
