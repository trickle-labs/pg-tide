# Prometheus rules for the core pg-tide operator questions.
groups:
  - name: pg_tide_relay_core
    interval: 60s
    rules:
      - alert: PgTidePipelineUnhealthy
        expr: pg_tide_relay_pipeline_healthy == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "pg-tide pipeline {{ $labels.pipeline }} is unhealthy"
          description: "Check status and doctor; see docs/src/operations/runbooks.md#pipeline-not-discovered. No-data is unknown, not healthy."
          runbook_url: "https://github.com/trickle-labs/pg_tide/blob/main/docs/src/operations/runbooks.md#pipeline-not-discovered"
      - alert: PgTideConsumerLagHigh
        expr: pg_tide_relay_consumer_lag > 10000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "pg-tide pipeline {{ $labels.pipeline }} has high lag"
          description: "Confirm source rate, sink latency, ownership, and retries; see docs/src/operations/runbooks.md#pipeline-has-lag."
          runbook_url: "https://github.com/trickle-labs/pg_tide/blob/main/docs/src/operations/runbooks.md#pipeline-has-lag"
      - alert: PgTidePublishErrors
        expr: rate(pg_tide_relay_publish_errors_total[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "pg-tide publish errors for {{ $labels.pipeline }}"
          description: "Inspect the redacted connector error and credentials without disabling TLS; see docs/src/operations/runbooks.md#sink-authentication-failure."
          runbook_url: "https://github.com/trickle-labs/pg_tide/blob/main/docs/src/operations/runbooks.md#sink-authentication-failure"
      - alert: PgTideDLQDepthHigh
        expr: pg_tide_relay_dlq_depth > 100
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "pg-tide unresolved DLQ depth is high for {{ $labels.pipeline }}"
          description: "Separate unresolved depth from write rate and use safe replay; see docs/src/operations/runbooks.md#dlq-is-growing."
          runbook_url: "https://github.com/trickle-labs/pg_tide/blob/main/docs/src/operations/runbooks.md#dlq-is-growing"
      - alert: PgTidePoolWaiting
        expr: pg_tide_relay_pool_connections{state="waiting"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "pg-tide PostgreSQL pool has waiting connections"
          description: "Check database capacity and query/lock latency; see docs/src/operations/runbooks.md#pipeline-has-lag."
          runbook_url: "https://github.com/trickle-labs/pg_tide/blob/main/docs/src/operations/runbooks.md#pipeline-has-lag"
