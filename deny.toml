# cargo-deny configuration (v0.13.0 supply-chain hardening)
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# cargo-deny 0.19+ schema v2: vulnerability/unsound/notice fields removed;
# they always fail. Only yanked and unmaintained are configurable.
version = 2
yanked = "warn"
unmaintained = "workspace"

[licenses]
# Allow standard permissive and weak-copyleft licences.
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
# Warn on duplicate versions of the same crate (large version skews can hide
# known-bad versions from audits).
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Known duplicates that are acceptable (e.g., transitive constraints).
skip = [
    # Various ecosystem crates have not yet aligned on a single version.
    { name = "base64" },
    { name = "bitflags" },
    { name = "futures-channel" },
    { name = "futures-core" },
    { name = "futures-io" },
    { name = "futures-sink" },
    { name = "futures-task" },
    { name = "futures-util" },
    { name = "pin-project-lite" },
    { name = "proc-macro2" },
    { name = "quote" },
    { name = "regex" },
    { name = "regex-syntax" },
    { name = "syn" },
    { name = "tokio" },
    { name = "tokio-util" },
    { name = "indexmap" },
    { name = "hashbrown" },
]

[sources]
# Only allow crates from crates.io.
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
