name: Lifecycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-contract:
    name: Lifecycle contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install just
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends just
      - name: Validate lifecycle contract
        run: just check-lifecycle-contract

  lifecycle-compatibility:
    name: Relay compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1
      - name: Run compatibility tests
        run: just test-lifecycle-compatibility

  lifecycle-adjacent:
    name: Adjacent lifecycle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1
      - name: Install just
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends just
      - name: Run adjacent lifecycle checks
        run: just test-lifecycle-adjacent
