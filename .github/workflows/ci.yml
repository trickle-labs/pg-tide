  # v0.16.0: Grafana dashboard metric name consistency check.
  dashboard-check:
    name: Grafana Dashboard Metric Name Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify dashboard references known metric names
        run: |
          # Extract all metric name constants from metrics.rs
          METRICS=$(grep -o 'pg_tide_relay_[a-z_]*' pg-tide-relay/src/metrics.rs | sort -u)
          # Extract metric names referenced in the Grafana dashboard.
          # Strip Prometheus histogram/summary suffixes (_bucket, _sum, _count)
          # so that e.g. pg_tide_relay_delivery_latency_seconds_bucket maps to
          # the base metric name pg_tide_relay_delivery_latency_seconds.
          DASHBOARD_METRICS=$(grep -o 'pg_tide_relay_[a-z_]*' pg-tide/dashboards/relay-health.json 2>/dev/null \
            | sed -E 's/_(bucket|sum|count)$//' \
            | sort -u || true)
          echo "Metrics in metrics.rs:"
          echo "$METRICS"
          if [ -n "$DASHBOARD_METRICS" ]; then
            echo "Metrics referenced in dashboard (normalised):"
            echo "$DASHBOARD_METRICS"
            # Check that every dashboard metric exists in metrics.rs
            UNKNOWN=""
            for m in $DASHBOARD_METRICS; do
              if ! echo "$METRICS" | grep -q "^${m}$"; then
                UNKNOWN="$UNKNOWN $m"
              fi
            done
            if [ -n "$UNKNOWN" ]; then
              echo "ERROR: Dashboard references unknown metric(s):$UNKNOWN"
              exit 1
            fi
            echo "All dashboard metric names verified."
          else
            echo "No pg_tide_relay_* metrics in dashboard — skipping check."
          fi

  # Guard against stale PGTRICKLE_RELAY_* env-var references in docs.
  # All references must use the current PG_TIDE_* prefix.
  no-stale-env-vars:
    name: No Stale PGTRICKLE_RELAY_* References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Assert no docs reference PGTRICKLE_ prefix
        run: |
          # CHANGELOG.md may document the historical rename; check only active docs.
          if grep -r 'PGTRICKLE_' docs/src/ README.md 2>/dev/null | grep -v "^Binary file"; then
            echo "ERROR: Found stale PGTRICKLE_ env-var references — rename to PG_TIDE_*"
            exit 1
          fi
          echo "OK: No stale PGTRICKLE_ references found."

  # v0.26.0: Guard against expect() calls in production (non-test) relay code.
  # SAFETY-annotated expect() calls are permitted; bare ones are not.
  lint-expect:
    name: No bare expect() in production relay code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Assert no bare expect() in production relay source
        run: |
          python3 - <<'EOF'
          import os, sys, re
          violations = []
          src_dir = "pg-tide-relay/src"
          for root, dirs, files in os.walk(src_dir):
              for fname in files:
                  if not fname.endswith(".rs"):
                      continue
                  path = os.path.join(root, fname)
                  with open(path) as f:
                      lines = f.readlines()
                  in_test_depth = 0
                  pending_test = False
                  for i, line in enumerate(lines):
                      stripped = line.strip()
                      if re.search(r'#\[cfg\(.*\btest\b', stripped):
                          pending_test = True
                      opens = stripped.count("{")
                      closes = stripped.count("}")
                      if pending_test and opens > 0:
                          in_test_depth = opens - closes
                          pending_test = False
                      elif in_test_depth > 0:
                          in_test_depth += opens - closes
                          if in_test_depth <= 0:
                              in_test_depth = 0
                      if in_test_depth > 0:
                          continue
                      if stripped.startswith("//"):
                          continue
                      if ".expect(" not in stripped:
                          continue
                      window = lines[max(0, i-5):i]
                      if not any("// SAFETY:" in l for l in window):
                          violations.append(f"{path}:{i+1}: {line.rstrip()}")
          if violations:
              print("ERROR: bare .expect() calls found in production relay code:")
              for v in violations:
                  print(" ", v)
              print()
              print("Replace with .ok_or_else(|| RelayError::...) ? propagation,")
              print("or add a '// SAFETY:' comment within 5 lines before the expect() call.")
              sys.exit(1)
          print("OK: No bare expect() calls in production relay code.")
          EOF

  # v0.26.0: pg_dump schema-diff CI assertion.
  # Verifies that fresh-install schema matches sequential upgrade schema.
  schema-diff:
    name: pg_dump Schema Diff (fresh vs. sequential upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 1
          done

      - name: Install fresh schema (single CREATE EXTENSION equivalent)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE fresh_schema;"
          psql -h 127.0.0.1 -U postgres -d fresh_schema -c "CREATE SCHEMA tide;"

          # Apply base schema and all migrations sequentially (fresh install path).
          psql -h 127.0.0.1 -U postgres -d fresh_schema \
            -f sql/pg_tide--0.1.0.sql

          # v0.40.0: Derive the ordered upgrade chain from the repository files
          # (version-sorted) instead of a hard-coded list.
          for f in $(ls sql/pg_tide--*--*.sql | sort -V); do
            psql -h 127.0.0.1 -U postgres -d fresh_schema -f "$f"
          done

      - name: Capture fresh schema dump
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump -h 127.0.0.1 -U postgres -d fresh_schema \
            --schema-only --schema=tide \
            --no-owner --no-privileges \
            | grep -v '^--' \
            | grep -v '^$' \
            | sort > /tmp/fresh_schema.sql

      - name: Create upgrade schema (base install + apply all migrations)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE upgrade_schema;"
          psql -h 127.0.0.1 -U postgres -d upgrade_schema -c "CREATE SCHEMA tide;"
          psql -h 127.0.0.1 -U postgres -d upgrade_schema -f sql/pg_tide--0.1.0.sql

          # v0.40.0: Derive the ordered upgrade chain from the repository files.
          for f in $(ls sql/pg_tide--*--*.sql | sort -V); do
            psql -h 127.0.0.1 -U postgres -d upgrade_schema -f "$f"
          done

      - name: Capture upgrade schema dump
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump -h 127.0.0.1 -U postgres -d upgrade_schema \
            --schema-only --schema=tide \
            --no-owner --no-privileges \
            | grep -v '^--' \
            | grep -v '^$' \
            | sort > /tmp/upgrade_schema.sql

      - name: Compare fresh and upgrade schema dumps
        run: |
          echo "=== Fresh schema (first 20 lines) ==="
          head -20 /tmp/fresh_schema.sql
          echo ""
          echo "=== Upgrade schema (first 20 lines) ==="
          head -20 /tmp/upgrade_schema.sql
          echo ""
          echo "=== Diff ==="
          if diff --ignore-space-change /tmp/fresh_schema.sql /tmp/upgrade_schema.sql; then
            echo "OK: Fresh install and sequential upgrade produce identical schemas."
          else
            echo "FAIL: Schema drift detected between fresh install and sequential upgrade."
            echo "This means the SQL migration files are inconsistent with the base install SQL."
            exit 1
          fi

  # v0.30.0: Wire format fuzz targets — run for 60 seconds on every PR.
  fuzz-wire-formats:
    name: Wire Format Fuzz (60 s corpus run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-fuzz
        # rustix (a dep of cargo-fuzz) sometimes fails to compile on GitHub-hosted runners
        # without this flag; forcing libc-based auxv makes it succeed.
        run: RUSTFLAGS="--cfg=rustix_use_libc" cargo install cargo-fuzz

      - name: Run wire format fuzz target (60 seconds)
        run: |
          cd pg-tide-relay
          cargo +nightly fuzz run fuzz_wire_format -- -max_total_time=60 -jobs=1

  # v0.30.0: Helm chart version-alignment CI check.
  helm-version-check:
    name: Helm Chart Version Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install yq
        run: sudo snap install yq

      - name: Check Helm chart version matches workspace version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          HELM_VERSION=$(yq .version helm/pg-tide/Chart.yaml)
          HELM_APP_VERSION=$(yq .appVersion helm/pg-tide/Chart.yaml | tr -d '"')
          echo "Cargo version: ${CARGO_VERSION}"
          echo "Helm chart version: ${HELM_VERSION}"
          echo "Helm appVersion: ${HELM_APP_VERSION}"
          MISMATCH=0
          if [ "${CARGO_VERSION}" != "${HELM_VERSION}" ]; then
            echo "ERROR: Cargo.toml version (${CARGO_VERSION}) != Helm chart version (${HELM_VERSION})"
            MISMATCH=1
          fi
          if [ "${CARGO_VERSION}" != "${HELM_APP_VERSION}" ]; then
            echo "ERROR: Cargo.toml version (${CARGO_VERSION}) != Helm appVersion (${HELM_APP_VERSION})"
            MISMATCH=1
          fi
          if [ "${MISMATCH}" = "1" ]; then
            echo "Run 'just bump-version <version>' to synchronise all version files."
            exit 1
          fi
          echo "OK: All version files are in sync at ${CARGO_VERSION}"

  # v0.31.0: Guard against unquoted SQL identifier interpolation in relay source.
  # Flags any format!() call that produces tide.{ident} without surrounding double quotes.
  lint-quoting:
    name: No unquoted SQL identifier interpolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Assert no unquoted SQL identifiers in relay source
        run: |
          python3 - <<'EOF'
          import os, sys, re
          violations = []
          src_dir = "pg-tide-relay/src"
          unquoted_pattern = re.compile(r'tide\.\{(?!")')
          for root, dirs, files in os.walk(src_dir):
              for fname in files:
                  if not fname.endswith(".rs"):
                      continue
                  path = os.path.join(root, fname)
                  with open(path) as f:
                      lines = f.readlines()
                  in_test_depth = 0
                  pending_test = False
                  for i, line in enumerate(lines):
                      stripped = line.strip()
                      if re.search(r'#\[cfg\(.*\btest\b', stripped):
                          pending_test = True
                      opens = stripped.count("{")
                      closes = stripped.count("}")
                      if pending_test and opens > 0:
                          in_test_depth = opens - closes
                          pending_test = False
                      elif in_test_depth > 0:
                          in_test_depth += opens - closes
                          if in_test_depth <= 0:
                              in_test_depth = 0
                      if in_test_depth > 0:
                          continue
                      if stripped.startswith("//"):
                          continue
                      # Skip display/log lines — println!, eprintln!, tracing macros
                      if re.search(r'println!\s*\(|eprintln!\s*\(|tracing::|format_args!', stripped):
                          continue
                      if not unquoted_pattern.search(stripped):
                          continue
                      window = lines[max(0, i-3):i]
                      if any("// QUOTED:" in l for l in window):
                          continue
                      violations.append(f"{path}:{i+1}: {line.rstrip()}")
          if violations:
              print("ERROR: unquoted identifier interpolation in relay SQL format strings:")
              for v in violations:
                  print(" ", v)
              print()
              print("Change tide.{name} to tide.\"{name}\" (double-quoted),")
              print("or add a '// QUOTED:' comment within 3 lines above.")
              sys.exit(1)
          print("OK: No unquoted SQL identifier interpolation found.")
          EOF

  # v0.31.0: Migration test currency check.
  # Asserts that migration_test.rs covers the current workspace version.
  migration-test-currency:
    name: Migration Test Currency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Assert migration_test.rs covers current workspace version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # Derive the expected final UPGRADES entry from the version.
          # Format: "X.Y-1.Z → X.Y.Z" where we compute the previous minor.
          MAJOR=$(echo "${CARGO_VERSION}" | cut -d. -f1)
          MINOR=$(echo "${CARGO_VERSION}" | cut -d. -f2)
          PATCH=$(echo "${CARGO_VERSION}" | cut -d. -f3)
          PREV_MINOR=$((MINOR - 1))
          EXPECTED_LABEL="${MAJOR}.${PREV_MINOR}.${PATCH} → ${MAJOR}.${MINOR}.${PATCH}"
          echo "Workspace version: ${CARGO_VERSION}"
          echo "Expected migration label: ${EXPECTED_LABEL}"
          if ! grep -q "\"${EXPECTED_LABEL}\"" pg-tide-relay/tests/migration_test.rs; then
            echo "ERROR: migration_test.rs does not contain the expected upgrade label:"
            echo "  \"${EXPECTED_LABEL}\""
            echo ""
            echo "Add the following to the UPGRADES array in migration_test.rs:"
            echo "  (\"${EXPECTED_LABEL}\", V$(echo ${MAJOR}_${PREV_MINOR}_0_TO_${MAJOR}_${MINOR}_0 | tr '.' '_')),"
            echo ""
            echo "And add the corresponding const at the top of the file:"
            PREV_PADDED=$(echo "${CARGO_VERSION}" | sed "s/\.${MINOR}\./\.${PREV_MINOR}\./" )
            echo "  const V$(echo ${MAJOR}_${PREV_MINOR}_0_TO_${MAJOR}_${MINOR}_0 | tr '.' '_'): &str ="
            echo "      include_str!(\"../../sql/pg_tide--${PREV_PADDED}--${CARGO_VERSION}.sql\");"
            exit 1
          fi
          echo "OK: migration_test.rs covers the current workspace version ${CARGO_VERSION}"

  operator-surfaces:
    name: Operator surfaces (dashboards, alerts, runbooks, Helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate observability contracts
        run: python3 scripts/check_observability.py
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate Helm YAML inputs
        run: |
          for f in examples/cnpg/*.yaml pg-tide/dashboards/alerts.yaml; do
            ruby -e 'require "yaml"; YAML.load_stream(File.read(ARGV[0]))' "$f"
          done
      - name: Check Helm chart when available
        run: command -v helm >/dev/null && helm lint helm/pg-tide || echo 'helm not installed; static checks completed'
