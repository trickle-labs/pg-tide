            | grep -v '_v2' | grep -vE "^(${ALLOWLIST}):" || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: active positional relay API calls found (use *_v2 JSONB forms):"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no active positional relay API calls in documentation."

      - name: Verify migration chain completeness through workspace version
        run: bash scripts/check_upgrade_completeness.sh

  supply-chain:
