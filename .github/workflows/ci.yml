name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (relay — no PostgreSQL required)
        run: cargo clippy --package pg-tide-relay --all-targets --all-features -- -D warnings

  lint-ext:
    name: Clippy (pg-tide-ext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ext-${{ hashFiles('**/Cargo.lock') }}

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=0.18.0" --locked

      - name: Init pgrx with system PostgreSQL 18
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Clippy (pg-tide-ext)
        run: cargo clippy --package pg-tide-ext --all-targets --features pg18 -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (for pgrx bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev pkg-config

      - name: Run relay unit tests
        run: cargo test --package pg-tide-relay --bins -- --test-threads=4

  test-integration:
    name: Relay Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Run integration tests (testcontainers)
        run: cargo test --package pg-tide-relay --test '*' --all-features -- --test-threads=1

  # v0.16.0: Additional parallel integration test job groups by backend category.
  # Splits the 40+ test files into groups to reduce CI wall-clock time.
  test-integration-core:
    name: Integration Tests — Core (migration, sql-api, wire-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-core-${{ hashFiles('**/Cargo.lock') }}

      - name: Run core integration tests
        run: |
          cargo test --package pg-tide-relay --test migration_test -- --test-threads=1
          cargo test --package pg-tide-relay --test sql_api_test -- --test-threads=1
          cargo test --package pg-tide-relay --test sql_to_sink_e2e -- --test-threads=1
          cargo test --package pg-tide-relay --test wire_format_test -- --test-threads=1
          cargo test --package pg-tide-relay --test wire_format_proptest -- --test-threads=1

  test-integration-relay:
    name: Integration Tests — Relay (coordinator, circuit breaker, DLQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-relay-${{ hashFiles('**/Cargo.lock') }}

      - name: Run relay coordinator tests
        run: |
          cargo test --package pg-tide-relay --test multi_pipeline_test -- --test-threads=1
          cargo test --package pg-tide-relay --test circuit_breaker_test -- --test-threads=1
          cargo test --package pg-tide-relay --test dlq_test -- --test-threads=1
          cargo test --package pg-tide-relay --test consumer_group_test -- --test-threads=1
          cargo test --package pg-tide-relay --test graceful_shutdown_test -- --test-threads=1
          cargo test --package pg-tide-relay --test outbox_source_test -- --test-threads=1
          cargo test --package pg-tide-relay --test batch_inbox_test -- --test-threads=1
          cargo test --package pg-tide-relay --test replay_test -- --test-threads=1
          cargo test --package pg-tide-relay --test dry_run_test -- --test-threads=1
          cargo test --package pg-tide-relay --test sighup_test -- --test-threads=1
          cargo test --package pg-tide-relay --test backpressure_test -- --test-threads=1

  test-ext-pgrx:
    name: Extension pgrx Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pgrx-${{ hashFiles('**/Cargo.lock') }}

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=0.18.0" --locked

      - name: Init pgrx with system PostgreSQL 18
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Run pgrx tests
        run: |
          # cargo-pgrx installs the extension into the system PostgreSQL
          # extension directory, which is owned by root. Grant write access
          # to the runner user so pgrx install --test succeeds.
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib
          cargo pgrx test pg18 --package pg-tide-ext

  supply-chain:
    name: Supply-Chain Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny check
        run: cargo deny check

  # v0.16.0: Link checker — validates URLs in README and docs on every PR.
  link-check:
    name: Link Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check links in README and docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --exclude-loopback
            --exclude-mail
            --timeout 30
            --max-retries 3
            --accept 200,204,206,301,302,307,308
            README.md
            docs/**/*.md
            CHANGELOG.md
            ROADMAP.md
          fail: true
        continue-on-error: true

  # v0.16.0: Grafana dashboard metric name consistency check.
  dashboard-check:
    name: Grafana Dashboard Metric Name Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify dashboard references known metric names
        run: |
          # Extract all metric name constants from metrics.rs
          METRICS=$(grep -o 'pg_tide_relay_[a-z_]*' pg-tide-relay/src/metrics.rs | sort -u)
          # Extract metric names referenced in the Grafana dashboard.
          # Strip Prometheus histogram/summary suffixes (_bucket, _sum, _count)
          # so that e.g. pg_tide_relay_delivery_latency_seconds_bucket maps to
          # the base metric name pg_tide_relay_delivery_latency_seconds.
          DASHBOARD_METRICS=$(grep -o 'pg_tide_relay_[a-z_]*' pg-tide/dashboards/relay-health.json 2>/dev/null \
            | sed -E 's/_(bucket|sum|count)$//' \
            | sort -u || true)
          echo "Metrics in metrics.rs:"
          echo "$METRICS"
          if [ -n "$DASHBOARD_METRICS" ]; then
            echo "Metrics referenced in dashboard (normalised):"
            echo "$DASHBOARD_METRICS"
            # Check that every dashboard metric exists in metrics.rs
            UNKNOWN=""
            for m in $DASHBOARD_METRICS; do
              if ! echo "$METRICS" | grep -q "^${m}$"; then
                UNKNOWN="$UNKNOWN $m"
              fi
            done
            if [ -n "$UNKNOWN" ]; then
              echo "ERROR: Dashboard references unknown metric(s):$UNKNOWN"
              exit 1
            fi
            echo "All dashboard metric names verified."
          else
            echo "No pg_tide_relay_* metrics in dashboard — skipping check."
          fi

  # v0.17.0: Guard against stale PGTRICKLE_RELAY_* env-var references in docs.
  # All references must use the current PG_TIDE_* prefix.
  no-stale-env-vars:
    name: No Stale PGTRICKLE_RELAY_* References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assert no docs reference PGTRICKLE_ prefix
        run: |
          # CHANGELOG.md may document the historical rename; check only active docs.
          if grep -r 'PGTRICKLE_' docs/ README.md 2>/dev/null | grep -v "^Binary file"; then
            echo "ERROR: Found stale PGTRICKLE_ env-var references — rename to PG_TIDE_*"
            exit 1
          fi
          echo "OK: No stale PGTRICKLE_ references found."

  # v0.17.0: SQL → relay → file-sink E2E test — verifies the SQL/relay contract.
  test-e2e:
    name: SQL → relay → sink E2E test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Run SQL → relay → sink E2E test
        run: cargo test --package pg-tide-relay --test sql_to_sink_e2e -- --test-threads=1
