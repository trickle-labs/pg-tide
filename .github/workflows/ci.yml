name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security-static:
    name: Static supply-chain and artifact policy checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check locked production policy (static mode)
        run: python3 scripts/check_supply_chain.py --static
      - name: Check release allowlists (static mode)
        run: python3 scripts/check_release_artifacts.py --static --profile core

  connector-registry:
    name: Connector registry and generated output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check connector registry
        run: python3 scripts/generate_connector_surface.py --check

  v1-surface:
    name: v1 surface boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check v1 surface boundary
        run: python3 scripts/check_v1_surface.py

  v1-contracts:
    name: v1 contract and release-evidence indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check v1 contract manifest
        run: |
          if command -v just >/dev/null 2>&1; then
            just check-v1-contracts
          else
            python3 scripts/check_v1_contracts.py
          fi
      - name: Check v1 machine-readable artifacts
        run: python3 scripts/check_v1_artifacts.py
      - name: Check required-test inventory
        run: python3 scripts/check_required_tests.py --check-manifest
      - name: Check flake registry
        run: python3 scripts/check_flake_registry.py --check
      - name: Check pre-v1 baseline
        run: python3 scripts/check_pre_v1_baseline.py --check
      - name: Check release-evidence indexes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("release-evidence")

          def load(name):
              value = json.loads((root / name).read_text(encoding="utf-8"))
              assert value["schema_version"] == 1
              assert value["release"] == "v0.47.0"
              return value

          release = load("v0.47.0-index.json")
          pilots = load("v0.47.0-pilots.json")
          reviews = load("v0.47.0-reviews.json")
          assert release["status"] in {"pending", "ready"}
          assert release["contract"]["checker"] == "just check-v1-contracts"
          assert [pilot["id"] for pilot in pilots["required_profiles"]] == [
              "pilot-nats",
              "pilot-kafka",
              "pilot-postgresql-inbox",
              "pilot-webhook",
          ]
          assert [review["id"] for review in reviews["required_disciplines"]] == [
              "postgresql-extension",
              "rust-async-concurrency",
              "delivery-semantics",
              "security",
              "operations",
          ]
          for pilot in pilots["required_profiles"]:
              assert pilot["status"] in {"pending", "complete"}
              assert pilot["operator_signoff"]["pilot_id"] == pilot["id"]
          for review in reviews["required_disciplines"]:
              assert review["status"] in {"pending", "approved"}
              assert review["approval"]["status"] in {"required", "approved"}
          print("release-evidence indexes: structurally valid")
          PY

  operational-contract:
    name: Operational budget and benchmark contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate operational budget configuration
        run: python3 scripts/check_operational_budgets.py --check-config

  clean-checkout:
    name: Clean checkout workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1
      - name: Build and test the workspace
        run: |
          cargo build --workspace --exclude pg-tide-ext --locked
          cargo test --workspace --exclude pg-tide-ext --locked --no-default-features --features core
          cargo package --package pg-tide-relay --locked --allow-dirty

  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (relay — no PostgreSQL required)
        run: cargo clippy --package pg-tide-relay --all-targets --no-default-features --features core -- -D warnings

  lint-ext:
    name: Clippy (pg-tide-ext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ext-${{ hashFiles('**/Cargo.lock') }}

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=0.18.0" --locked

      - name: Init pgrx with system PostgreSQL 18
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Clippy (pg-tide-ext)
        run: cargo clippy --package pg-tide-ext --all-targets --features pg18 -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (for pgrx bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev pkg-config

      - name: Run relay unit tests
        run: cargo test --package pg-tide-relay --bins -- --test-threads=4

  test-integration:
    name: Relay Core Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free disk space for integration tests
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Run integration tests (testcontainers)
        run: cargo test --package pg-tide-relay --test '*' --no-default-features --features core -- --test-threads=1

  test-integration-kafka:
    name: Integration Tests - Kafka KRaft (core-kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-kafka-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Kafka KRaft protocol tests
        run: cargo test --package pg-tide-relay --test kafka_test --no-default-features --features core-kafka -- --test-threads=1

  # v0.16.0: Additional parallel integration test job groups by backend category.
  # Splits the 40+ test files into groups to reduce CI wall-clock time.
  test-integration-core:
    name: Integration Tests — Core (migration, sql-api, wire-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-core-${{ hashFiles('**/Cargo.lock') }}

      - name: Run core integration tests
        run: |
          cargo test --package pg-tide-relay --test migration_test -- --test-threads=1
          cargo test --package pg-tide-relay --test sql_api_test -- --test-threads=1
          cargo test --package pg-tide-relay --test outbox_source_test -- --test-threads=1
          cargo test --package pg-tide-relay --test v037_validation_test -- --test-threads=1
          cargo test --package pg-tide-relay --test v038_validation_test -- --test-threads=1
          cargo test --package pg-tide-relay --test v040_validation_test -- --test-threads=1

  # HA failover integration test for the retained forward relay.
  test-integration-ha:
    name: Integration Tests — HA Failover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ha-${{ hashFiles('**/Cargo.lock') }}

      - name: Run HA failover tests
        run: cargo test --package pg-tide-relay --test ha_failover_test -- --test-threads=1

  # v0.43.0: Direct PostgreSQL insert microbenchmark. This is not relay
  # throughput evidence; the operational reference job runs on a scheduled
  # PostgreSQL/NATS environment.
  test-load:
    name: PostgreSQL Insert Microbenchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-load-${{ hashFiles('**/Cargo.lock') }}

      - name: Run PostgreSQL insert microbenchmark
        run: |
          cargo test --package pg-tide-relay --test postgres_insert_microbenchmark -- --test-threads=1

  test-integration-relay:
    name: Integration Tests — Relay (coordinator, circuit breaker, DLQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-relay-${{ hashFiles('**/Cargo.lock') }}

      - name: Run relay coordinator tests
        run: |
          cargo test --package pg-tide-relay --test multi_pipeline_test -- --test-threads=1
          cargo test --package pg-tide-relay --test circuit_breaker_test -- --test-threads=1
          cargo test --package pg-tide-relay --test dlq_test -- --test-threads=1
          cargo test --package pg-tide-relay --test dlq_fault_injection_test -- --test-threads=1
          cargo test --package pg-tide-relay --test consumer_group_test -- --test-threads=1
          cargo test --package pg-tide-relay --test graceful_shutdown_test -- --test-threads=1
          cargo test --package pg-tide-relay --test outbox_source_test -- --test-threads=1
          cargo test --package pg-tide-relay --test batch_inbox_test -- --test-threads=1
          cargo test --package pg-tide-relay --test pg_inbox_sink_test -- --test-threads=1
          cargo test --package pg-tide-relay --test replay_test -- --test-threads=1
          cargo test --package pg-tide-relay --test dry_run_test -- --test-threads=1
          cargo test --package pg-tide-relay --test sighup_test -- --test-threads=1
          cargo test --package pg-tide-relay --test backpressure_test -- --test-threads=1

  test-ext-pgrx:
    name: Extension pgrx Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pgrx-${{ hashFiles('**/Cargo.lock') }}

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=0.18.0" --locked

      - name: Init pgrx with system PostgreSQL 18
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Run pgrx tests
        run: |
          # cargo-pgrx installs the extension into the system PostgreSQL
          # extension directory, which is owned by root. Grant write access
          # to the runner user so pgrx install --test succeeds.
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib
          cargo pgrx test pg18 --package pg-tide-ext

  # v0.40.0 (Workstream G): Authoritative public-API outbox → NATS JetStream E2E.
  # Installs the packaged extension into a real PostgreSQL 18, then runs the
  # public_api_outbox_to_nats_e2e test (NATS provided by testcontainers).
  public-api-nats-e2e:
    name: Public API Outbox → NATS JetStream E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-public-api-nats-${{ hashFiles('**/Cargo.lock') }}

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=0.18.0" --locked

      - name: Init pgrx with system PostgreSQL 18
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Install pg_tide into system PostgreSQL 18
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib
          cargo pgrx install --package pg-tide-ext --pg-config /usr/lib/postgresql/18/bin/pg_config

      - name: Start PostgreSQL 18 and create a test database
        run: |
          sudo service postgresql stop || true
          while read -r version name _; do
            sudo pg_ctlcluster "$version" "$name" stop || true
          done < <(sudo pg_lsclusters --no-header)
          sudo pg_dropcluster --stop 18 main || true
          sudo pg_createcluster 18 main --start --port=5432
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb pgtide_e2e

      - name: Run public API outbox → NATS JetStream E2E
        env:
          PG_TIDE_E2E_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/pgtide_e2e"
          PG_TIDE_RELAY_BIN: "${{ github.workspace }}/target/debug/pg-tide"
        run: |
          cargo build --package pg-tide-relay --bin pg-tide --no-default-features --features core
          PG_TIDE_E2E_DATABASE_URL="${PG_TIDE_E2E_DATABASE_URL}?sslmode=disable" \
            cargo test --package pg-tide-relay --test public_api_outbox_to_nats_e2e -- \
            --ignored --test-threads=1 --nocapture

      - name: Run public API outbox → PostgreSQL inbox E2E
        env:
          PG_TIDE_E2E_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/pgtide_e2e?sslmode=disable"
          PG_TIDE_RELAY_BIN: "${{ github.workspace }}/target/debug/pg-tide"
        run: cargo test --package pg-tide-relay --test public_api_outbox_to_pg_inbox_e2e -- --ignored --test-threads=1 --nocapture

      - name: Run public API outbox → webhook E2E
        env:
          PG_TIDE_E2E_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/pgtide_e2e?sslmode=disable"
          PG_TIDE_RELAY_BIN: "${{ github.workspace }}/target/debug/pg-tide"
        run: cargo test --package pg-tide-relay --test public_api_outbox_to_webhook_e2e -- --ignored --test-threads=1 --nocapture

  public-api-kafka-e2e:
    name: Public API Outbox -> Kafka KRaft E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-public-api-kafka-${{ hashFiles('**/Cargo.lock') }}

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=0.18.0" --locked

      - name: Init pgrx with system PostgreSQL 18
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Install pg_tide into system PostgreSQL 18
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib
          cargo pgrx install --package pg-tide-ext --pg-config /usr/lib/postgresql/18/bin/pg_config

      - name: Start PostgreSQL 18 and create a test database
        run: |
          sudo service postgresql stop || true
          while read -r version name _; do
            sudo pg_ctlcluster "$version" "$name" stop || true
          done < <(sudo pg_lsclusters --no-header)
          sudo pg_dropcluster --stop 18 main || true
          sudo pg_createcluster 18 main --start --port=5432
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb pgtide_e2e

      - name: Run public API outbox -> Kafka KRaft E2E
        env:
          PG_TIDE_E2E_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/pgtide_e2e?sslmode=disable"
        run: |
          cargo build --package pg-tide-relay --bin pg-tide --no-default-features --features core-kafka
          PG_TIDE_RELAY_BIN="${{ github.workspace }}/target/debug/pg-tide" \
            cargo test --package pg-tide-relay --test public_api_outbox_to_kafka_e2e \
            --no-default-features --features core-kafka -- --ignored --test-threads=1 --nocapture

  # v0.40.0 (Workstream H.3): Execute the marked Quick Start SQL blocks against a
  # real installed extension.
  quickstart-sql:
    name: Executable Quick Start SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config python3
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx and pg_tide
        run: |
          cargo install cargo-pgrx --version "=0.18.0" --locked
          cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib
          cargo pgrx install --package pg-tide-ext --pg-config /usr/lib/postgresql/18/bin/pg_config

      - name: Start PostgreSQL and run marked Quick Start SQL
        env:
          PGURL: "postgres://postgres:postgres@127.0.0.1:5432/postgres"
        run: |
          sudo service postgresql stop || true
          while read -r version name _; do
            sudo pg_ctlcluster "$version" "$name" stop || true
          done < <(sudo pg_lsclusters --no-header)
          sudo pg_dropcluster --stop 18 main || true
          sudo pg_createcluster 18 main --start --port=5432
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          python3 scripts/run_quickstart_sql.py \
            README.md docs/src/getting-started/first-pipeline.md

  # v0.50.0: Real packaged fresh-install vs upgrade parity.
  # CREATE EXTENSION '0.50.0' vs CREATE EXTENSION '0.49.0' + ALTER EXTENSION UPDATE.
  real-extension-parity:
    name: Real Fresh Install vs Upgrade Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: |
          cargo install cargo-pgrx --version "=0.18.0" --locked
          cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Install packaged v0.49.0 extension
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib
          git clone --depth 1 --branch v0.49.0 \
            https://github.com/trickle-labs/pg-tide.git "$GITHUB_WORKSPACE/v049-source"
          (
            cd "$GITHUB_WORKSPACE/v049-source"
            sed -i 's/members = \["pg-tide-ext", "pg-tide-relay"\]/members = ["pg-tide-ext"]/' Cargo.toml
            cargo pgrx install --package pg-tide-ext \
              --pg-config /usr/lib/postgresql/18/bin/pg_config
          )

      - name: Install packaged v0.49.0 extension
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib
          cargo pgrx install --package pg-tide-ext --pg-config /usr/lib/postgresql/18/bin/pg_config
          sudo cp sql/pg_tide--0.49.0--0.50.0.sql \
            /usr/share/postgresql/18/extension/pg_tide--0.49.0--0.50.0.sql

      - name: Verify upgrade path exists (chain completeness through workspace version)
        run: bash scripts/check_upgrade_completeness.sh

      - name: Compare real fresh-install vs upgrade schema
        run: |
          sudo service postgresql stop || true
          while read -r version name _; do
            sudo pg_ctlcluster "$version" "$name" stop || true
          done < <(sudo pg_lsclusters --no-header)
          sudo pg_dropcluster --stop 18 main || true
          sudo pg_createcluster 18 main --start --port=5432
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          export PGPASSWORD=postgres
          # Create the v0.49 database while its shared library is installed.
          (
            cd "$GITHUB_WORKSPACE/v049-source"
            cargo pgrx install --package pg-tide-ext \
              --pg-config /usr/lib/postgresql/18/bin/pg_config
          )
          psql -h 127.0.0.1 -U postgres -c "DROP DATABASE IF EXISTS upgrade50;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE upgrade50;"
          psql -h 127.0.0.1 -U postgres -d upgrade50 -c "CREATE EXTENSION pg_tide VERSION '0.49.0';"
          cargo pgrx install --package pg-tide-ext --pg-config /usr/lib/postgresql/18/bin/pg_config
          # Fresh install directly at the current version.
          psql -h 127.0.0.1 -U postgres -c "DROP DATABASE IF EXISTS fresh50;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE fresh50;"
          psql -h 127.0.0.1 -U postgres -d fresh50 -c "CREATE EXTENSION pg_tide VERSION '0.50.0';"
          # Upgrade from the last pre-v0.50.0 surface.
          psql -h 127.0.0.1 -U postgres -d upgrade50 -c "ALTER EXTENSION pg_tide UPDATE TO '0.50.0';"
          # Normalized schema comparison.
          for db in fresh50 upgrade50; do
            pg_dump -h 127.0.0.1 -U postgres -d "$db" --schema-only --schema=tide \
              --no-owner --no-privileges \
              | grep -v '^--' \
              | grep -v '^$' \
              | grep -v '^\\restrict ' \
              | grep -v '^\\unrestrict ' \
              | sort > "/dev/shm/${db}.sql"
          done
          if diff --ignore-space-change /dev/shm/fresh50.sql /dev/shm/upgrade50.sql; then
            echo "OK: real fresh install and 0.49.0 -> 0.50.0 upgrade produce identical tide schemas."
          else
            echo "FAIL: fresh vs upgrade schema drift for v0.50.0."
            exit 1
          fi

  # v0.41.0: Fast doc/migration guards (no build required).
  docs-migration-guards:
    name: Docs & Migration Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject active positional relay API calls in docs
        run: |
          ALLOWLIST='docs/src/operations/v1-migration-guide.md|docs/src/guides/migrating-to-pg-tide.md|docs/src/integration/pg-trickle.md'
