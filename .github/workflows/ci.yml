name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # v0.38.0: Checkout rocklake at the sibling path expected by the path
      # dependency in pg-tide-relay/Cargo.toml (../../rocklake2).
      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (relay — no PostgreSQL required)
        run: cargo clippy --package pg-tide-relay --all-targets --all-features -- -D warnings

  lint-ext:
    name: Clippy (pg-tide-ext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ext-${{ hashFiles('**/Cargo.lock') }}

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=0.18.0" --locked

      - name: Init pgrx with system PostgreSQL 18
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Clippy (pg-tide-ext)
        run: cargo clippy --package pg-tide-ext --all-targets --features pg18 -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (for pgrx bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libclang-dev clang llvm-dev pkg-config

      - name: Run relay unit tests
        run: cargo test --package pg-tide-relay --bins -- --test-threads=4

  test-integration:
    name: Relay Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # v0.38.0: Checkout rocklake at the sibling path expected by the path
      # dependency in pg-tide-relay/Cargo.toml (../../rocklake2).
      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Free disk space for integration tests
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}

      - name: Run integration tests (testcontainers)
        run: cargo test --package pg-tide-relay --test '*' --all-features -- --test-threads=1

  # v0.16.0: Additional parallel integration test job groups by backend category.
  # Splits the 40+ test files into groups to reduce CI wall-clock time.
  test-integration-core:
    name: Integration Tests — Core (migration, sql-api, wire-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-core-${{ hashFiles('**/Cargo.lock') }}

      - name: Run core integration tests
        run: |
          cargo test --package pg-tide-relay --test migration_test -- --test-threads=1
          cargo test --package pg-tide-relay --test sql_api_test -- --test-threads=1
          cargo test --package pg-tide-relay --test sql_to_sink_e2e -- --test-threads=1
          cargo test --package pg-tide-relay --test wire_format_test -- --test-threads=1
          cargo test --package pg-tide-relay --test wire_format_proptest -- --test-threads=1
          cargo test --package pg-tide-relay --test dag_test -- --test-threads=1
          cargo test --package pg-tide-relay --test v037_validation_test -- --test-threads=1
          cargo test --package pg-tide-relay --test v038_validation_test -- --test-threads=1

  # v0.38.0: RockLake Phase 6 integration tests.
  # Uses PgWireHarness (in-process RockLake PG-wire server) — no Docker required.
  test-integration-rocklake:
    name: Integration Tests — RockLake Phase 6 & 7 (v0.38.0)
    runs-on: ubuntu-latest
    env:
      CARGO_NET_RETRY: 10
    steps:
      - uses: actions/checkout@v6

      # Checkout rocklake at the sibling path expected by the path dependency.
      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rocklake-${{ hashFiles('**/Cargo.lock') }}

      - name: Run RockLake integration tests
        run: |
          cargo test --package pg-tide-relay --test rocklake_test \
            --features rocklake -- --test-threads=1

  # v0.30.0: DAG and HA failover integration tests.
  test-integration-dag:
    name: Integration Tests — DAG & HA Failover (v0.30.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dag-${{ hashFiles('**/Cargo.lock') }}

      - name: Run DAG and HA failover tests
        run: |
          cargo test --package pg-tide-relay --test dag_test -- --test-threads=1
          cargo test --package pg-tide-relay --test ha_failover_test -- --test-threads=1

  # v0.30.0: Sustained-throughput load test.
  test-load:
    name: Sustained-Throughput Load Test (v0.30.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-load-${{ hashFiles('**/Cargo.lock') }}

      - name: Run load test (50k messages, ≥ 10k msg/s)
        run: |
          cargo test --package pg-tide-relay --test load_test -- --test-threads=1

  test-integration-relay:
    name: Integration Tests — Relay (coordinator, circuit breaker, DLQ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-relay-${{ hashFiles('**/Cargo.lock') }}

      - name: Run relay coordinator tests
        run: |
          cargo test --package pg-tide-relay --test multi_pipeline_test -- --test-threads=1
          cargo test --package pg-tide-relay --test circuit_breaker_test -- --test-threads=1
          cargo test --package pg-tide-relay --test dlq_test -- --test-threads=1
          cargo test --package pg-tide-relay --test dlq_fault_injection_test -- --test-threads=1
          cargo test --package pg-tide-relay --test consumer_group_test -- --test-threads=1
          cargo test --package pg-tide-relay --test graceful_shutdown_test -- --test-threads=1
          cargo test --package pg-tide-relay --test outbox_source_test -- --test-threads=1
          cargo test --package pg-tide-relay --test batch_inbox_test -- --test-threads=1
          cargo test --package pg-tide-relay --test pg_inbox_sink_test -- --test-threads=1
          cargo test --package pg-tide-relay --test replay_test -- --test-threads=1
          cargo test --package pg-tide-relay --test dry_run_test -- --test-threads=1
          cargo test --package pg-tide-relay --test sighup_test -- --test-threads=1
          cargo test --package pg-tide-relay --test backpressure_test -- --test-threads=1

  test-ext-pgrx:
    name: Extension pgrx Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pgrx-${{ hashFiles('**/Cargo.lock') }}

      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release \
            libclang-dev clang llvm-dev pkg-config
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "=0.18.0" --locked

      - name: Init pgrx with system PostgreSQL 18
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - name: Run pgrx tests
        run: |
          # cargo-pgrx installs the extension into the system PostgreSQL
          # extension directory, which is owned by root. Grant write access
          # to the runner user so pgrx install --test succeeds.
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib
          cargo pgrx test pg18 --package pg-tide-ext

  supply-chain:
    name: Supply-Chain Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2" 

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny check
        run: cargo deny check

  # v0.16.0: Link checker — validates URLs in README and docs on every PR.
  link-check:
    name: Link Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check links in README and docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --exclude-loopback
            --exclude-mail
            --timeout 30
            --max-retries 3
            --accept 200,204,206,301,302,307,308
            README.md
            docs/**/*.md
            CHANGELOG.md
            ROADMAP.md
          fail: true
        continue-on-error: true

  # v0.16.0: Grafana dashboard metric name consistency check.
  dashboard-check:
    name: Grafana Dashboard Metric Name Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify dashboard references known metric names
        run: |
          # Extract all metric name constants from metrics.rs
          METRICS=$(grep -o 'pg_tide_relay_[a-z_]*' pg-tide-relay/src/metrics.rs | sort -u)
          # Extract metric names referenced in the Grafana dashboard.
          # Strip Prometheus histogram/summary suffixes (_bucket, _sum, _count)
          # so that e.g. pg_tide_relay_delivery_latency_seconds_bucket maps to
          # the base metric name pg_tide_relay_delivery_latency_seconds.
          DASHBOARD_METRICS=$(grep -o 'pg_tide_relay_[a-z_]*' pg-tide/dashboards/relay-health.json 2>/dev/null \
            | sed -E 's/_(bucket|sum|count)$//' \
            | sort -u || true)
          echo "Metrics in metrics.rs:"
          echo "$METRICS"
          if [ -n "$DASHBOARD_METRICS" ]; then
            echo "Metrics referenced in dashboard (normalised):"
            echo "$DASHBOARD_METRICS"
            # Check that every dashboard metric exists in metrics.rs
            UNKNOWN=""
            for m in $DASHBOARD_METRICS; do
              if ! echo "$METRICS" | grep -q "^${m}$"; then
                UNKNOWN="$UNKNOWN $m"
              fi
            done
            if [ -n "$UNKNOWN" ]; then
              echo "ERROR: Dashboard references unknown metric(s):$UNKNOWN"
              exit 1
            fi
            echo "All dashboard metric names verified."
          else
            echo "No pg_tide_relay_* metrics in dashboard — skipping check."
          fi

  # v0.17.0: Guard against stale PGTRICKLE_RELAY_* env-var references in docs.
  # All references must use the current PG_TIDE_* prefix.
  no-stale-env-vars:
    name: No Stale PGTRICKLE_RELAY_* References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assert no docs reference PGTRICKLE_ prefix
        run: |
          # CHANGELOG.md may document the historical rename; check only active docs.
          if grep -r 'PGTRICKLE_' docs/ README.md 2>/dev/null | grep -v "^Binary file"; then
            echo "ERROR: Found stale PGTRICKLE_ env-var references — rename to PG_TIDE_*"
            exit 1
          fi
          echo "OK: No stale PGTRICKLE_ references found."

  # v0.17.0: SQL → relay → file-sink E2E test — verifies the SQL/relay contract.
  test-e2e:
    name: SQL → relay → sink E2E test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Run SQL → relay → sink E2E test
        run: cargo test --package pg-tide-relay --test sql_to_sink_e2e -- --test-threads=1

  # v0.26.0: Guard against expect() calls in production (non-test) relay code.
  # SAFETY-annotated expect() calls are permitted; bare ones are not.
  lint-expect:
    name: No bare expect() in production relay code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assert no bare expect() in production relay source
        run: |
          python3 - <<'EOF'
          import os, sys, re
          violations = []
          src_dir = "pg-tide-relay/src"
          for root, dirs, files in os.walk(src_dir):
              for fname in files:
                  if not fname.endswith(".rs"):
                      continue
                  path = os.path.join(root, fname)
                  with open(path) as f:
                      lines = f.readlines()
                  in_test_depth = 0
                  pending_test = False
                  for i, line in enumerate(lines):
                      stripped = line.strip()
                      if re.search(r'#\[cfg\(.*\btest\b', stripped):
                          pending_test = True
                      opens = stripped.count("{")
                      closes = stripped.count("}")
                      if pending_test and opens > 0:
                          in_test_depth = opens - closes
                          pending_test = False
                      elif in_test_depth > 0:
                          in_test_depth += opens - closes
                          if in_test_depth <= 0:
                              in_test_depth = 0
                      if in_test_depth > 0:
                          continue
                      if stripped.startswith("//"):
                          continue
                      if ".expect(" not in stripped:
                          continue
                      window = lines[max(0, i-5):i]
                      if not any("// SAFETY:" in l for l in window):
                          violations.append(f"{path}:{i+1}: {line.rstrip()}")
          if violations:
              print("ERROR: bare .expect() calls found in production relay code:")
              for v in violations:
                  print(" ", v)
              print()
              print("Replace with .ok_or_else(|| RelayError::...) ? propagation,")
              print("or add a '// SAFETY:' comment within 5 lines before the expect() call.")
              sys.exit(1)
          print("OK: No bare expect() calls in production relay code.")
          EOF

  # v0.26.0: pg_dump schema-diff CI assertion.
  # Verifies that fresh-install schema matches sequential upgrade schema.
  schema-diff:
    name: pg_dump Schema Diff (fresh vs. sequential upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 1
          done

      - name: Install fresh schema (single CREATE EXTENSION equivalent)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE fresh_schema;"
          psql -h 127.0.0.1 -U postgres -d fresh_schema -c "CREATE SCHEMA tide;"

          # Apply base schema and all migrations sequentially (fresh install path).
          psql -h 127.0.0.1 -U postgres -d fresh_schema \
            -f sql/pg_tide--0.1.0.sql

          for f in \
            sql/pg_tide--0.1.0--0.2.0.sql \
            sql/pg_tide--0.2.0--0.3.0.sql \
            sql/pg_tide--0.3.0--0.4.0.sql \
            sql/pg_tide--0.4.0--0.5.0.sql \
            sql/pg_tide--0.5.0--0.6.0.sql \
            sql/pg_tide--0.6.0--0.7.0.sql \
            sql/pg_tide--0.7.0--0.8.0.sql \
            sql/pg_tide--0.8.0--0.9.0.sql \
            sql/pg_tide--0.9.0--0.10.0.sql \
            sql/pg_tide--0.10.0--0.11.0.sql \
            sql/pg_tide--0.11.0--0.12.0.sql \
            sql/pg_tide--0.12.0--0.13.0.sql \
            sql/pg_tide--0.13.0--0.14.0.sql \
            sql/pg_tide--0.14.0--0.15.0.sql \
            sql/pg_tide--0.15.0--0.16.0.sql \
            sql/pg_tide--0.16.0--0.17.0.sql \
            sql/pg_tide--0.17.0--0.18.0.sql \
            sql/pg_tide--0.18.0--0.19.0.sql \
            sql/pg_tide--0.19.0--0.20.0.sql \
            sql/pg_tide--0.20.0--0.21.0.sql \
            sql/pg_tide--0.21.0--0.22.0.sql \
            sql/pg_tide--0.22.0--0.23.0.sql \
            sql/pg_tide--0.23.0--0.24.0.sql \
            sql/pg_tide--0.24.0--0.25.0.sql \
            sql/pg_tide--0.25.0--0.26.0.sql \
            sql/pg_tide--0.26.0--0.27.0.sql \
            sql/pg_tide--0.27.0--0.28.0.sql \
            sql/pg_tide--0.28.0--0.29.0.sql \
            sql/pg_tide--0.29.0--0.30.0.sql \
            sql/pg_tide--0.30.0--0.31.0.sql \
            sql/pg_tide--0.31.0--0.32.0.sql; do
            psql -h 127.0.0.1 -U postgres -d fresh_schema -f "$f"
          done

      - name: Capture fresh schema dump
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump -h 127.0.0.1 -U postgres -d fresh_schema \
            --schema-only --schema=tide \
            --no-owner --no-privileges \
            | grep -v '^--' \
            | grep -v '^$' \
            | sort > /tmp/fresh_schema.sql

      - name: Create upgrade schema (base install + apply all migrations)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE upgrade_schema;"
          psql -h 127.0.0.1 -U postgres -d upgrade_schema -c "CREATE SCHEMA tide;"
          psql -h 127.0.0.1 -U postgres -d upgrade_schema -f sql/pg_tide--0.1.0.sql

          for f in \
            sql/pg_tide--0.1.0--0.2.0.sql \
            sql/pg_tide--0.2.0--0.3.0.sql \
            sql/pg_tide--0.3.0--0.4.0.sql \
            sql/pg_tide--0.4.0--0.5.0.sql \
            sql/pg_tide--0.5.0--0.6.0.sql \
            sql/pg_tide--0.6.0--0.7.0.sql \
            sql/pg_tide--0.7.0--0.8.0.sql \
            sql/pg_tide--0.8.0--0.9.0.sql \
            sql/pg_tide--0.9.0--0.10.0.sql \
            sql/pg_tide--0.10.0--0.11.0.sql \
            sql/pg_tide--0.11.0--0.12.0.sql \
            sql/pg_tide--0.12.0--0.13.0.sql \
            sql/pg_tide--0.13.0--0.14.0.sql \
            sql/pg_tide--0.14.0--0.15.0.sql \
            sql/pg_tide--0.15.0--0.16.0.sql \
            sql/pg_tide--0.16.0--0.17.0.sql \
            sql/pg_tide--0.17.0--0.18.0.sql \
            sql/pg_tide--0.18.0--0.19.0.sql \
            sql/pg_tide--0.19.0--0.20.0.sql \
            sql/pg_tide--0.20.0--0.21.0.sql \
            sql/pg_tide--0.21.0--0.22.0.sql \
            sql/pg_tide--0.22.0--0.23.0.sql \
            sql/pg_tide--0.23.0--0.24.0.sql \
            sql/pg_tide--0.24.0--0.25.0.sql \
            sql/pg_tide--0.25.0--0.26.0.sql \
            sql/pg_tide--0.26.0--0.27.0.sql \
            sql/pg_tide--0.27.0--0.28.0.sql \
            sql/pg_tide--0.28.0--0.29.0.sql \
            sql/pg_tide--0.29.0--0.30.0.sql \
            sql/pg_tide--0.30.0--0.31.0.sql \
            sql/pg_tide--0.31.0--0.32.0.sql; do
            psql -h 127.0.0.1 -U postgres -d upgrade_schema -f "$f"
          done

      - name: Capture upgrade schema dump
        env:
          PGPASSWORD: postgres
        run: |
          pg_dump -h 127.0.0.1 -U postgres -d upgrade_schema \
            --schema-only --schema=tide \
            --no-owner --no-privileges \
            | grep -v '^--' \
            | grep -v '^$' \
            | sort > /tmp/upgrade_schema.sql

      - name: Compare fresh and upgrade schema dumps
        run: |
          echo "=== Fresh schema (first 20 lines) ==="
          head -20 /tmp/fresh_schema.sql
          echo ""
          echo "=== Upgrade schema (first 20 lines) ==="
          head -20 /tmp/upgrade_schema.sql
          echo ""
          echo "=== Diff ==="
          if diff --ignore-space-change /tmp/fresh_schema.sql /tmp/upgrade_schema.sql; then
            echo "OK: Fresh install and sequential upgrade produce identical schemas."
          else
            echo "FAIL: Schema drift detected between fresh install and sequential upgrade."
            echo "This means the SQL migration files are inconsistent with the base install SQL."
            exit 1
          fi

  # v0.30.0: Wire format fuzz targets — run for 60 seconds on every PR.
  fuzz-wire-formats:
    name: Wire Format Fuzz (60 s corpus run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trickle-labs/rocklake
          ref: v0.27.14
          path: rocklake2

      - name: Move rocklake2 to sibling path (satisfies path dep ../../rocklake2)
        run: mv "$GITHUB_WORKSPACE/rocklake2" "$(dirname "$GITHUB_WORKSPACE")/rocklake2"

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-fuzz
        # rustix (a dep of cargo-fuzz) sometimes fails to compile on GitHub-hosted runners
        # without this flag; forcing libc-based auxv makes it succeed.
        run: RUSTFLAGS="--cfg=rustix_use_libc" cargo install cargo-fuzz

      - name: Run wire format fuzz target (60 seconds)
        run: |
          cd pg-tide-relay
          cargo fuzz run fuzz_wire_format -- -max_total_time=60 -jobs=1

  # v0.30.0: Helm chart version-alignment CI check.
  helm-version-check:
    name: Helm Chart Version Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq
        run: sudo snap install yq

      - name: Check Helm chart version matches workspace version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          HELM_VERSION=$(yq .version helm/pg-tide/Chart.yaml)
          HELM_APP_VERSION=$(yq .appVersion helm/pg-tide/Chart.yaml | tr -d '"')
          echo "Cargo version: ${CARGO_VERSION}"
          echo "Helm chart version: ${HELM_VERSION}"
          echo "Helm appVersion: ${HELM_APP_VERSION}"
          MISMATCH=0
          if [ "${CARGO_VERSION}" != "${HELM_VERSION}" ]; then
            echo "ERROR: Cargo.toml version (${CARGO_VERSION}) != Helm chart version (${HELM_VERSION})"
            MISMATCH=1
          fi
          if [ "${CARGO_VERSION}" != "${HELM_APP_VERSION}" ]; then
            echo "ERROR: Cargo.toml version (${CARGO_VERSION}) != Helm appVersion (${HELM_APP_VERSION})"
            MISMATCH=1
          fi
          if [ "${MISMATCH}" = "1" ]; then
            echo "Run 'just bump-version <version>' to synchronise all version files."
            exit 1
          fi
          echo "OK: All version files are in sync at ${CARGO_VERSION}"

  # v0.31.0: Guard against unquoted SQL identifier interpolation in relay source.
  # Flags any format!() call that produces tide.{ident} without surrounding double quotes.
  lint-quoting:
    name: No unquoted SQL identifier interpolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assert no unquoted SQL identifiers in relay source
        run: |
          python3 - <<'EOF'
          import os, sys, re
          violations = []
          src_dir = "pg-tide-relay/src"
          unquoted_pattern = re.compile(r'tide\.\{(?!")')
          for root, dirs, files in os.walk(src_dir):
              for fname in files:
                  if not fname.endswith(".rs"):
                      continue
                  path = os.path.join(root, fname)
                  with open(path) as f:
                      lines = f.readlines()
                  in_test_depth = 0
                  pending_test = False
                  for i, line in enumerate(lines):
                      stripped = line.strip()
                      if re.search(r'#\[cfg\(.*\btest\b', stripped):
                          pending_test = True
                      opens = stripped.count("{")
                      closes = stripped.count("}")
                      if pending_test and opens > 0:
                          in_test_depth = opens - closes
                          pending_test = False
                      elif in_test_depth > 0:
                          in_test_depth += opens - closes
                          if in_test_depth <= 0:
                              in_test_depth = 0
                      if in_test_depth > 0:
                          continue
                      if stripped.startswith("//"):
                          continue
                      # Skip display/log lines — println!, eprintln!, tracing macros
                      if re.search(r'println!\s*\(|eprintln!\s*\(|tracing::|format_args!', stripped):
                          continue
                      if not unquoted_pattern.search(stripped):
                          continue
                      window = lines[max(0, i-3):i]
                      if any("// QUOTED:" in l for l in window):
                          continue
                      violations.append(f"{path}:{i+1}: {line.rstrip()}")
          if violations:
              print("ERROR: unquoted identifier interpolation in relay SQL format strings:")
              for v in violations:
                  print(" ", v)
              print()
              print("Change tide.{name} to tide.\"{name}\" (double-quoted),")
              print("or add a '// QUOTED:' comment within 3 lines above.")
              sys.exit(1)
          print("OK: No unquoted SQL identifier interpolation found.")
          EOF

  # v0.31.0: Migration test currency check.
  # Asserts that migration_test.rs covers the current workspace version.
  migration-test-currency:
    name: Migration Test Currency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assert migration_test.rs covers current workspace version
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # Derive the expected final UPGRADES entry from the version.
          # Format: "X.Y-1.Z → X.Y.Z" where we compute the previous minor.
          MAJOR=$(echo "${CARGO_VERSION}" | cut -d. -f1)
          MINOR=$(echo "${CARGO_VERSION}" | cut -d. -f2)
          PATCH=$(echo "${CARGO_VERSION}" | cut -d. -f3)
          PREV_MINOR=$((MINOR - 1))
          EXPECTED_LABEL="${MAJOR}.${PREV_MINOR}.${PATCH} → ${MAJOR}.${MINOR}.${PATCH}"
          echo "Workspace version: ${CARGO_VERSION}"
          echo "Expected migration label: ${EXPECTED_LABEL}"
          if ! grep -q "\"${EXPECTED_LABEL}\"" pg-tide-relay/tests/migration_test.rs; then
            echo "ERROR: migration_test.rs does not contain the expected upgrade label:"
            echo "  \"${EXPECTED_LABEL}\""
            echo ""
            echo "Add the following to the UPGRADES array in migration_test.rs:"
            echo "  (\"${EXPECTED_LABEL}\", V$(echo ${MAJOR}_${PREV_MINOR}_0_TO_${MAJOR}_${MINOR}_0 | tr '.' '_')),"
            echo ""
            echo "And add the corresponding const at the top of the file:"
            PREV_PADDED=$(echo "${CARGO_VERSION}" | sed "s/\.${MINOR}\./\.${PREV_MINOR}\./" )
            echo "  const V$(echo ${MAJOR}_${PREV_MINOR}_0_TO_${MAJOR}_${MINOR}_0 | tr '.' '_'): &str ="
            echo "      include_str!(\"../../sql/pg_tide--${PREV_PADDED}--${CARGO_VERSION}.sql\");"
            exit 1
          fi
          echo "OK: migration_test.rs covers the current workspace version ${CARGO_VERSION}"

  ducklake-compat:
    name: DuckLake Compatibility (DuckDB Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install duckdb psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U testuser && break
            sleep 1
          done

      - name: Run DuckLake compatibility smoke test
        env:
          PG_URL: "postgres://testuser:testpass@localhost/testdb"
        run: python scripts/ducklake_compat_smoke.py
