name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  # v0.16.0: Required for keyless cosign OIDC signing.
  id-token: write

jobs:
  release-verification:
    name: Read-only release verification hook
    runs-on: ubuntu-latest
    needs: release-gates
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check locked supply-chain policy without network
        run: python3 scripts/check_supply_chain.py --static
      - name: Check artifact policy without asserting pending evidence
        run: |
          python3 scripts/check_release_artifacts.py --static --profile core
          echo "Producer checksums, SBOMs, provenance, and signatures are not ready evidence in this hook."

  release-gates:
    name: release evidence and blocker gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check v1 contract manifest
        run: |
          if command -v just >/dev/null 2>&1; then
            just check-v1-contracts
          else
            python3 scripts/check_v1_contracts.py
          fi
      - name: Check v1 machine-readable artifacts
        run: python3 scripts/check_v1_artifacts.py
      - name: Check required-test inventory
        run: python3 scripts/check_required_tests.py --check-manifest
      - name: Check flake registry
        run: python3 scripts/check_flake_registry.py --check
      - name: Check pre-v1 baseline
        run: python3 scripts/check_pre_v1_baseline.py --check
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Run authoritative extension clean room
        run: GITHUB_JOB=extension-cleanroom python3 scripts/run_required_test.py extension-cleanroom
      - name: Validate extension clean-room result
        if: always()
        run: python3 scripts/check_required_tests.py --check-results target/required-tests --ids extension-cleanroom
      - name: Upload extension clean-room evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-cleanroom-release-${{ github.run_id }}
          path: |
            target/extension-cleanroom/
            target/required-tests/extension-cleanroom.*
          if-no-files-found: warn
      - name: Verify release evidence and zero P0/P1 issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags origin
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n1 "$GITHUB_REF_NAME")" = "$TAG_SHA"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path("release-evidence")
          tag = os.environ["GITHUB_REF_NAME"]
          release_name = f"{tag}-index.json"
          if not (root / release_name).is_file():
              raise SystemExit(f"missing release evidence: {release_name}")

          def load(name):
              value = json.loads((root / name).read_text(encoding="utf-8"))
              assert value["schema_version"] == 1
              assert value["release"] == tag
              return value

          release = load(release_name)
          assert release["status"] == "ready", "release evidence is not ready"
          assert release["candidate"]["commit"] == os.environ["TAG_SHA"]
          assert release["open_blockers"] == 0
          assert release["release_manager"]["status"] == "approved"
          if tag == "v0.52.0":
              security = load("v0.52.0-security.json")
              review = load("v0.52.0-security-review.json")
              response = load("v0.52.0-vulnerability-response.json")
              assert security["status"] == "ready"
              assert review["status"] == "approved"
              assert response["status"] == "complete"

          issues = json.loads(subprocess.check_output([
              "gh", "issue", "list", "--state", "open", "--search", "is:issue",
              "--limit", "1000", "--json", "number,labels",
          ], text=True))
          blockers = [
              issue["number"] for issue in issues
              if any(label["name"] in {"priority/P0", "priority/P1"} for label in issue["labels"])
          ]
          if blockers:
              raise SystemExit(f"open P0/P1 issues: {blockers}")
          print("release evidence ready; zero open P0/P1 issues")
          PY

  connector-registry:
    name: Check connector registry
    runs-on: ubuntu-latest
    needs: release-gates
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check generated connector surface
        run: python3 scripts/generate_connector_surface.py --check

  build:
    name: Build relay (${{ matrix.target }})
    needs: connector-registry
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: pg-tide
            archive_ext: tar.gz
            cargo_features: core
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: pg-tide
            archive_ext: tar.gz
            # kafka (rdkafka-sys) cross-compiles librdkafka with the host gcc producing x86_64
            # objects; the aarch64 cross-linker then rejects them ("file in wrong format")
            cargo_features: core
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: pg-tide.exe
            archive_ext: zip
            # kafka (rdkafka-sys) uses a Unix ./configure script and cannot build on Windows MSVC
            cargo_features: core
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: pg-tide
            archive_ext: tar.gz
            cargo_features: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary (core profile)
        run: cargo build --package pg-tide-relay --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.cargo_features }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binary (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../pg-tide-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Package binary (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            -DestinationPath "pg-tide-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pg-tide-${{ matrix.target }}
          path: pg-tide-${{ matrix.target }}.${{ matrix.archive_ext }}

  docker:
    name: Docker Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/trickle-labs/pg-tide
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image digest
        id: build
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          LABEL_ARGS=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && LABEL_ARGS+=(--label "$line")
          done <<< "$DOCKER_LABELS"
          for attempt in 1 2 3; do
            echo "=== Build/push attempt ${attempt}/3 ==="
            rm -f /tmp/buildx-metadata.json
            if docker buildx build \
              --platform "${{ matrix.platform }}" \
              --file Dockerfile \
              "${LABEL_ARGS[@]}" \
              --output "type=image,name=ghcr.io/trickle-labs/pg-tide,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file /tmp/buildx-metadata.json \
              .; then
              digest=$(jq -r '."containerimage.digest"' /tmp/buildx-metadata.json)
              echo "digest=${digest}" >> "$GITHUB_OUTPUT"
              echo "Succeeded: ${digest}"
              break
            fi
            if [[ ${attempt} -lt 3 ]]; then
              echo "Attempt ${attempt} failed, waiting $((attempt * 20))s..."
              sleep $((attempt * 20))
            else
              echo "All 3 attempts failed."
              exit 1
            fi
          done

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker Merge Manifests
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download amd64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: digests-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: digests-arm64
          path: /tmp/digests

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/trickle-labs/pg-tide
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.description=PostgreSQL 18 transactional outbox, idempotent inbox and relay — pg-tide" \
            --annotation "index:org.opencontainers.image.source=https://github.com/trickle-labs/pg-tide" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf 'ghcr.io/trickle-labs/pg-tide@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ghcr.io/trickle-labs/pg-tide:${{ steps.meta.outputs.version }}

  # v0.16.0: Keyless cosign signing for the multi-arch manifest.
  # Separated from docker-merge so id-token: write does not interfere
  # with docker/metadata-action's GitHub REST API calls.
  cosign-docker:
    name: Sign Docker Image (cosign)
    runs-on: ubuntu-latest
    needs: docker-merge
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Docker image (keyless cosign)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cosign sign --yes \
            ghcr.io/trickle-labs/pg-tide:${VERSION}
        env:
          COSIGN_EXPERIMENTAL: "1"

  # v0.19.0: Trivy vulnerability scan on the final slim image.
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker-merge
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (for version tag)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/trickle-labs/pg-tide
          tags: |
            type=semver,pattern={{version}}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/trickle-labs/pg-tide:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: trivy-results.sarif

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, cosign-docker, trivy-scan, release-verification]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: pg-tide-*
          merge-multiple: false

      # v0.44.0: Generate one CycloneDX SBOM for every final binary archive.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Generate archive SBOMs and provenance subjects
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 |
            while IFS= read -r -d '' archive; do
              name="$(basename "$archive")"
              syft "file:${archive}" -o cyclonedx-json \
                > "release-evidence/${name}.sbom.cyclonedx.json"
              sha256sum "$archive" > "release-evidence/${name}.sha256"
            done

      - name: Log in to GHCR for image evidence
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate final image SBOM and provenance
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/trickle-labs/pg-tide:${GITHUB_REF_NAME#v}"
          docker pull --platform linux/amd64 "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          digest="$(docker buildx imagetools inspect "${IMAGE}" |
            awk '/Digest:/ && !found {print $2; found=1}')"
          test -n "${digest}"
          cat > release-evidence/pg-tide-image.provenance.json <<EOF
          {
            "buildType": "https://slsa.dev/provenance/v1",
            "builder": {"id": "https://github.com/trickle-labs/pg-tide/actions"},
            "invocation": {"commit": "${GITHUB_SHA}", "ref": "${GITHUB_REF}"},
            "subject": [{"name": "${IMAGE}", "digest": {"sha256": "${digest#sha256:}"}}]
          }
          EOF

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: release-evidence/pg-tide-image.sbom.cyclonedx.json
          exit-code: '0'

      - name: Record final release evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          artifacts = []
          for path in sorted(Path("artifacts").rglob("*")):
              if path.suffix in {".gz", ".zip"}:
                  artifacts.append({
                      "name": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          provenance = json.loads(Path(
              "release-evidence/pg-tide-image.provenance.json"
          ).read_text())
          record = {
              "schema_version": 1,
              "release": os.environ["GITHUB_REF_NAME"],
              "candidate_commit": os.environ["GITHUB_SHA"],
              "source_index": f"release-evidence/{os.environ['GITHUB_REF_NAME']}-index.json",
              "artifacts": artifacts,
              "image": provenance["subject"][0],
              "evidence_files": sorted(
                  str(path) for path in Path("release-evidence").iterdir()
                  if path.is_file()
              ),
          }
          Path(
              f"release-evidence/{os.environ['GITHUB_REF_NAME']}-final.json"
          ).write_text(
              json.dumps(record, indent=2) + "\n"
          )
          PY

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract text between this version's header and the next version header
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md)
          # Write to step output (multi-line safe)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"

      # v0.44.0: Keyless signatures and SLSA-compatible provenance for every
      # archive, plus SBOM/provenance attestations for the final image.
      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign release artifacts (keyless cosign)
        run: |
          IMAGE="ghcr.io/trickle-labs/pg-tide:${GITHUB_REF_NAME#v}"
          while IFS= read -r -d '' f; do
            cosign sign-blob --yes \
              --bundle "${f}.bundle" \
              "$f"
            digest="$(sha256sum "$f" | awk '{print $1}')"
            printf '%s\n' \
              '{"buildType":"https://slsa.dev/provenance/v1","builder":{"id":"https://github.com/trickle-labs/pg-tide/actions"},"invocation":{"commit":"'"${GITHUB_SHA}"'","ref":"'"${GITHUB_REF}"'"},"subject":[{"name":"'"$(basename "$f")"'","digest":{"sha256":"'"${digest}"'"}}]}' \
              > "${f}.provenance.json"
            cosign attest-blob --yes \
              --bundle "${f}.provenance.bundle" \
              --predicate "${f}.provenance.json" \
              --type slsaprovenance \
              "$f"
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0)
          cosign attest --yes \
            --predicate release-evidence/pg-tide-image.sbom.cyclonedx.json \
            --type cyclonedx \
            "${IMAGE}"
          cosign attest --yes \
            --predicate release-evidence/pg-tide-image.provenance.json \
            --type slsaprovenance \
            "${IMAGE}"
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Create signed GitHub release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="pg-tide ${tag#v}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          else
            gh release create "$tag" \
              --draft \
              --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi

          find artifacts release-evidence -type f -print0 |
            sort -z |
            while IFS= read -r -d '' file; do
              for attempt in 1 2 3; do
                if gh release upload "$tag" "$file" --clobber; then
                  break
                fi
                if [[ "$attempt" == 3 ]]; then
                  exit 1
                fi
                sleep 5
              done
            done

          gh release edit "$tag" --draft=false --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1

      - name: Publish pg-tide-relay
        # Only publish when a CARGO_REGISTRY_TOKEN secret is configured.
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --package pg-tide-relay --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
