name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  # v0.16.0: Required for keyless cosign OIDC signing.
  id-token: write

jobs:
  build:
    name: Build relay (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: pg-tide
            archive_ext: tar.gz
            cargo_flags: --all-features
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: pg-tide
            archive_ext: tar.gz
            # kafka (rdkafka-sys) cross-compiles librdkafka with the host gcc producing x86_64
            # objects; the aarch64 cross-linker then rejects them ("file in wrong format")
            cargo_flags: --features nats,webhook,stdout,redis,sqs,pg-inbox,rabbitmq,elasticsearch,pubsub,kinesis,servicebus,mqtt,eventhubs,object-storage,schema-registry,otel,slack,discord,pagerduty,arrow-flight,singer,airbyte,clickhouse,mongodb,snowflake,bigquery,iceberg,delta,ducklake,debezium,maxwell,canal,cdc-json
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: pg-tide.exe
            archive_ext: zip
            # kafka (rdkafka-sys) uses a Unix ./configure script and cannot build on Windows MSVC
            cargo_flags: --features nats,webhook,stdout,redis,sqs,pg-inbox,rabbitmq,elasticsearch,pubsub,kinesis,servicebus,mqtt,eventhubs,object-storage,schema-registry,otel,slack,discord,pagerduty,arrow-flight,singer,airbyte,clickhouse,mongodb,snowflake,bigquery,iceberg,delta,ducklake,debezium,maxwell,canal,cdc-json
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: pg-tide
            archive_ext: tar.gz
            cargo_flags: --all-features
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary (full features)
        run: cargo build --package pg-tide-relay --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binary (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../pg-tide-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Package binary (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            -DestinationPath "pg-tide-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pg-tide-${{ matrix.target }}
          path: pg-tide-${{ matrix.target }}.${{ matrix.archive_ext }}

  docker:
    name: Docker Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/trickle-labs/pg-tide
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/trickle-labs/pg-tide,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker Merge Manifests
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-amd64
          path: /tmp/digests

      - name: Download arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-arm64
          path: /tmp/digests

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/trickle-labs/pg-tide
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.description=PostgreSQL 18 transactional outbox, idempotent inbox and relay — pg-tide" \
            --annotation "index:org.opencontainers.image.source=https://github.com/trickle-labs/pg-tide" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf 'ghcr.io/trickle-labs/pg-tide@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ghcr.io/trickle-labs/pg-tide:${{ steps.meta.outputs.version }}

      # v0.16.0: Keyless cosign signing for the multi-arch manifest.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image (keyless cosign)
        run: |
          cosign sign --yes \
            ghcr.io/trickle-labs/pg-tide:${{ steps.meta.outputs.version }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  # v0.16.0: Build a "full" Docker image with all optional features compiled in.
  docker-full:
    name: Docker "full" Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Docker metadata (full image)
        id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/trickle-labs/pg-tide
          tags: |
            type=semver,pattern={{version}}-full
            type=raw,value=latest-full,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full image digest
        id: build-full
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            CARGO_FLAGS=--all-features
          labels: ${{ steps.meta-full.outputs.labels }}
          outputs: type=image,name=ghcr.io/trickle-labs/pg-tide,push-by-digest=true,name-canonical=true,push=true

      - name: Export full digest
        run: |
          mkdir -p /tmp/digests-full
          digest="${{ steps.build-full.outputs.digest }}"
          touch "/tmp/digests-full/${digest#sha256:}"

      - name: Upload full digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-full-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests-full/*
          if-no-files-found: error
          retention-days: 1

  docker-full-merge:
    name: Docker "full" Merge Manifests
    runs-on: ubuntu-latest
    needs: docker-full
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download full amd64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-full-amd64
          path: /tmp/digests-full

      - name: Download full arm64 digest
        uses: actions/download-artifact@v8
        with:
          name: digests-full-arm64
          path: /tmp/digests-full

      - name: Docker metadata (full)
        id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/trickle-labs/pg-tide
          tags: |
            type=semver,pattern={{version}}-full
            type=raw,value=latest-full,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push full multi-arch manifest
        working-directory: /tmp/digests-full
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta-full.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.description=pg-tide relay — full feature build (all backends)" \
            --annotation "index:org.opencontainers.image.source=https://github.com/trickle-labs/pg-tide" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf 'ghcr.io/trickle-labs/pg-tide@sha256:%s ' *)

      - name: Inspect full manifest
        run: |
          docker buildx imagetools inspect ghcr.io/trickle-labs/pg-tide:${{ steps.meta-full.outputs.version }}-full

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker-merge, docker-full-merge]
    steps:
      - uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: pg-tide-*
          merge-multiple: false

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract text between this version's header and the next version header
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md)
          # Write to step output (multi-line safe)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v0.16.0: Keyless cosign signing of release binary artifacts.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts (keyless cosign)
        run: |
          for f in artifacts/**/*.tar.gz artifacts/**/*.zip; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes \
              --bundle "${f}.bundle" \
              "$f"
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload cosign bundles to release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish pg-tide-relay
        # Only publish when a CARGO_REGISTRY_TOKEN secret is configured.
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: cargo publish --package pg-tide-relay --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
