name: Documentation

on:
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "book.toml"
      - "docs/**"
      - "examples/**"
      - "schemas/**"
      - "scripts/check_documentation.py"
      - "scripts/run_quickstart_sql.py"
      - "pg-tide-relay/src/**"
      - "pg-tide-ext/src/**"
      - "helm/pg-tide/**"
      - "sql/**"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "book.toml"
      - "docs/**"
      - "examples/**"
      - "schemas/**"
      - "scripts/check_documentation.py"
      - "scripts/run_quickstart_sql.py"
      - "pg-tide-relay/src/**"
      - "pg-tide-ext/src/**"
      - "helm/pg-tide/**"
      - "sql/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-contract:
    name: Documentation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check executable-example markers
        run: python3 scripts/check_documentation.py

  quickstart-sql:
    name: Executable Quick Start SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable / rust-toolchain.toml
        with:
          toolchain: 1.97.1
      - name: Install PostgreSQL 18 and build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg lsb-release libclang-dev clang llvm-dev pkg-config python3
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail -sS https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-server-dev-18
      - name: Install cargo-pgrx and pg_tide
        run: |
          cargo install cargo-pgrx --version "=0.18.0" --locked
          cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config
          sudo chown -R "$(id -u):$(id -g)" \
            /usr/share/postgresql/18/extension /usr/lib/postgresql/18/lib
          cargo pgrx install --package pg-tide-ext --pg-config /usr/lib/postgresql/18/bin/pg_config
      - name: Run marked Quick Start SQL
        env:
          PGURL: "postgres://postgres:postgres@127.0.0.1:5432/postgres"
        run: |
          sudo service postgresql stop || true
          while read -r version name _; do
            sudo pg_ctlcluster "$version" "$name" stop || true
          done < <(sudo pg_lsclusters --no-header)
          sudo pg_dropcluster --stop 18 main || true
          sudo pg_createcluster 18 main --start --port=5432
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          python3 scripts/run_quickstart_sql.py README.md docs/src/getting-started/first-pipeline.md

  build:
    name: Build documentation
    needs: [documentation-contract, quickstart-sql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install mdBook
        run: |
          cargo install mdbook --version "=0.4.52" --locked
          cargo install mdbook-admonish --version "=1.20.0" --locked
      - name: Build documentation
        run: mdbook build
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  link-check:
    name: Documentation link check
    needs: [documentation-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --exclude-loopback
            --timeout 30
            --max-retries 3
            --accept 200,204,206,301,302,307,308
            README.md docs/**/*.md CHANGELOG.md ROADMAP.md
          fail: true

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, link-check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
