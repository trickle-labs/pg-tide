[book]
title       = "pg_tide Documentation"
authors     = ["The pg_tide Contributors"]
src         = "docs/src"
language    = "en"

[build]
build-dir   = "docs/book"

[preprocessor.admonish]
command     = "mdbook-admonish"
assets_version = "3.0.2"

# v0.27.0: Define the current release version as a book variable.
# Used by mdbook-variables preprocessor (if installed) via {{current_version}}.
# Even without the preprocessor, this entry documents the release version.
[preprocessor.variables]
command = "mdbook-variables"

[preprocessor.variables.variables]
current_version = "0.27.0"

[output.html]
default-theme           = "navy"
preferred-dark-theme    = "navy"
git-repository-url      = "https://github.com/trickle-labs/pg-tide"
edit-url-template       = "https://github.com/trickle-labs/pg-tide/edit/main/docs/src/{path}"
site-url                = "/pg-tide/"

[output.html.search]
enable              = true
limit-results       = 20
use-boolean-and     = true
boost-title         = 2
heading-split-level = 3
