[package]
name = "pg-tide-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "Bidirectional relay binary for pg_tide — bridges outboxes/inboxes with NATS, Kafka, HTTP webhooks, Redis, SQS, RabbitMQ, and more"
keywords = ["postgresql", "streaming", "relay", "kafka", "nats"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "pg-tide"
path = "src/main.rs"

[features]
# Default: the most common forward sinks + stdout (no cmake build required)
default = ["nats", "webhook", "stdout"]

# Optional backends (each adds a Cargo dependency)
nats            = ["dep:async-nats"]
webhook         = ["dep:reqwest", "dep:hmac", "dep:sha2"]
kafka           = ["dep:rdkafka"]
stdout          = []
redis           = ["dep:redis"]
sqs             = ["dep:aws-sdk-sqs", "dep:aws-config"]
pg-inbox        = []        # no extra deps — uses tokio-postgres already
rabbitmq        = ["dep:lapin"]
# v0.5.0: Cloud provider parity + analytics backends
elasticsearch   = ["dep:reqwest", "dep:base64"]
pubsub          = ["dep:reqwest", "dep:base64"]
kinesis         = ["dep:aws-sdk-kinesis", "dep:aws-config"]
servicebus      = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:base64"]
# v0.6.0: IoT and data lake backends
mqtt            = ["dep:rumqttc"]
eventhubs       = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:base64"]
object-storage  = ["dep:object_store", "dep:parquet"]
# v0.7.0: Operational excellence features
schema-registry = ["dep:apache-avro"]
otel            = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
# Core async runtime + CLI
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-util", "fs", "io-std"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Error handling + logging
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"

# Metrics + health (always required — axum powers the /metrics and /health endpoints)
axum = "0.8"
prometheus = "0.14"

# Optional sink/source backends
async-nats = { version = "0.47", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false, optional = true }
rdkafka = { version = "0.39", optional = true }
redis = { version = "1.2", features = ["tokio-comp", "streams"], optional = true }
aws-sdk-sqs = { version = "1.98", optional = true }
aws-config = { version = "1.8", optional = true }
lapin = { version = "4", optional = true }
# v0.5.0 optional backends
aws-sdk-kinesis = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
# v0.6.0 optional backends
rumqttc = { version = "0.24", optional = true }
object_store = { version = "0.11", features = ["aws", "gcp", "azure"], optional = true }
parquet = { version = "54", optional = true }
# v0.7.0 optional backends
apache-avro = { version = "0.18", optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
# v0.7.0 always-on: JMESPath transforms + rate limiting
jmespath = "0.3"
governor = { version = "0.7", features = ["std"] }

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis", "rabbitmq"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
async-nats = "0.47"
lapin = "4"
redis = { version = "1.2", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json"], default-features = false }
aws-sdk-sqs = "1.98"
aws-sdk-kinesis = "1"
aws-sdk-s3 = "1"
aws-config = "1.8"
axum = "0.8"
bytes = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rumqttc = "0.24"
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
parquet = "54"

[[bench]]
name = "throughput"
harness = false
