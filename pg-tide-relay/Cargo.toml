[package]
name = "pg-tide-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "Production PostgreSQL outbox relay for inbox, NATS, Kafka, HTTPS webhooks, and diagnostics"
keywords = ["postgresql", "streaming", "relay", "kafka", "nats"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "pg-tide"
path = "src/main.rs"

[features]
# BEGIN GENERATED CONNECTOR PROFILES
default = ["core"]
core = ["native-tls", "nats", "stdout", "webhook"]
core-kafka = ["core", "kafka"]
# END GENERATED CONNECTOR PROFILES

# Internal crash-test instrumentation. Never included in a production profile.
test-failpoints = []

# Retained connector features
nats            = ["dep:async-nats"]
webhook         = ["dep:hmac"]
kafka           = ["dep:rdkafka"]
stdout          = []
kms             = []
kms-local       = ["kms", "dep:aes-gcm", "dep:base64"]
# PostgreSQL TLS via the platform OpenSSL stack
native-tls      = ["dep:postgres-openssl", "dep:openssl"]

[dependencies]
# Core async runtime + CLI
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-util", "fs", "io-std", "process"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Error handling + logging
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
libc = "0.2"

# Metrics + health
axum = "0.8"
prometheus = "0.14"

# Retained connector backends
async-nats = { version = "0.47", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
rdkafka = { version = "0.39", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = "0.10"
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

# Rate limiting and schema/URL validation
governor = { version = "0.7", features = ["std"] }
hex = "0.4"
regex-lite = "0.1"
rand = "0.9"

# PostgreSQL TLS
postgres-openssl = { version = "0.5", optional = true }
openssl = { version = "0.10", optional = true }

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
async-nats = "0.47"
reqwest = { version = "0.12", features = ["json"], default-features = false }
axum = "0.8"
bytes = "1"
proptest = "1"
sha2 = "0.10"

[[bench]]
name = "throughput"
harness = false
