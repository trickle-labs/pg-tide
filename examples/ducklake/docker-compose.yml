# pg-tide × DuckLake — Getting-Started Example
#
# A single `docker compose up` gives you:
#   • PostgreSQL 18 with the pg_tide extension installed
#   • MinIO (S3-compatible object storage) for Parquet files
#   • pg-tide relay pre-configured with a DuckLake sink
#   • DuckDB CLI container for querying the lake
#   • Grafana with the pg-tide relay health dashboard
#
# Usage:
#   docker compose up -d
#   docker compose exec seed /seed.sh     # publish 1 000 synthetic order events
#   docker compose exec duckdb duckdb     # interactive DuckDB session
#   open http://localhost:3000            # Grafana dashboard

version: "3.9"

services:
  # ── PostgreSQL 18 with pg_tide ────────────────────────────────────────────
  postgres:
    image: ghcr.io/trickle-labs/pg-tide:0.22.0
    environment:
      POSTGRES_USER: pgtide
      POSTGRES_PASSWORD: pgtide
      POSTGRES_DB: pgtide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgtide -d pgtide"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (S3-compatible object storage for Parquet files) ────────────────
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO bucket initialisation ───────────────────────────────────────────
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/pg-tide-lake &&
        mc anonymous set public local/pg-tide-lake &&
        echo 'MinIO bucket pg-tide-lake ready.'
      "

  # ── pg-tide relay ─────────────────────────────────────────────────────────
  relay:
    image: ghcr.io/trickle-labs/pg-tide:0.22.0
    entrypoint: ["/usr/local/bin/pg-tide"]
    environment:
      PG_TIDE_POSTGRES_URL: postgres://pgtide:pgtide@postgres:5432/pgtide
      PG_TIDE_METRICS_ADDR: "0.0.0.0:9090"
      PG_TIDE_LOG_FORMAT: json
      PG_TIDE_LOG_LEVEL: info
      # Object storage credentials (MinIO)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: us-east-1
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Seed script container ─────────────────────────────────────────────────
  seed:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: pgtide
    volumes:
      - ./seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "-c", "sleep 5 && /seed.sh"]
    profiles:
      - seed

  # ── DuckDB shell container ────────────────────────────────────────────────
  duckdb:
    image: ghcr.io/trickle-labs/duckdb:latest
    environment:
      POSTGRES_URL: postgres://pgtide:pgtide@postgres:5432/pgtide
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    profiles:
      - duckdb

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../pg-tide/dashboards:/etc/grafana/provisioning/dashboards/pg-tide:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - relay
    profiles:
      - grafana

volumes:
  postgres_data:
  minio_data:
  grafana_data:
